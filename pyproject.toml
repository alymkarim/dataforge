[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-data-platform"
version = "0.1.0"
description = "Observable medallion data pipeline for analytics and AI workloads"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "pyarrow>=16.0",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "structlog>=24.1",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
spark = ["pyspark>=3.5"]
snowflake = ["snowflake-connector-python[pandas]>=3.10"]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
ai-data-pipeline = "ai_data_platform.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --disable-warnings"

[tool.ruff]
line-length = 100
target-version = "py311"
